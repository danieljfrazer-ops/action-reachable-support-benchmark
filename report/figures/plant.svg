<path d="M150,160 L222,222" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/><text x="150" y="205" text-anchor="start" font-size="11" fill="#222">G_x, to half of x</text>
<path d="M310,73 L398,73" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/><text x="354.0" y="45" text-anchor="middle" font-size="11" fill="#222">B, delay τ</text>
<path d="M490,73 L568,73" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/><text x="529.0" y="64" text-anchor="middle" font-size="11" fill="#222">C_d</text>
<line x1="349" y1="63" x2="361" y2="83" stroke="#a00" stroke-width="2"/><line x1="361" y1="63" x2="349" y2="83" stroke="#a00" stroke-width="2"/>
<text x="355" y="34" text-anchor="middle" font-size="10.5" fill="#a00">event: column 0 of B set to zero</text>
