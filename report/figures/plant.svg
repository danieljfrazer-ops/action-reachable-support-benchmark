<rect x="220" y="50" width="90" height="46" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.2"/><text x="265.0" y="73.0" text-anchor="middle" font-size="14" font-weight="600">a</text><text x="265.0" y="89.0" text-anchor="middle" font-size="10.5" fill="#333">actions, K = 2</text>
<rect x="400" y="50" width="90" height="46" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.2"/><text x="445.0" y="73.0" text-anchor="middle" font-size="14" font-weight="600">b</text><text x="445.0" y="89.0" text-anchor="middle" font-size="10.5" fill="#333">body, 4</text>
<rect x="570" y="50" width="100" height="46" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.2"/><text x="620.0" y="73.0" text-anchor="middle" font-size="14" font-weight="600">d</text><text x="620.0" y="89.0" text-anchor="middle" font-size="10.5" fill="#333">downstream, 2</text>
<rect x="200" y="210" width="150" height="46" rx="6" fill="#f6f6f6" stroke="#222" stroke-width="1.2"/><text x="275.0" y="233.0" text-anchor="middle" font-size="14" font-weight="600">x</text><text x="275.0" y="249.0" text-anchor="middle" font-size="10.5" fill="#333">distractors, 10 or 30</text>
<rect x="570" y="210" width="100" height="46" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.2"/><text x="620.0" y="233.0" text-anchor="middle" font-size="14" font-weight="600">w</text><text x="620.0" y="249.0" text-anchor="middle" font-size="10.5" fill="#333">world, 4</text>
<text x="200" y="22" text-anchor="middle" font-size="11.5">ε<tspan baseline-shift="super" font-size="8">a</tspan> action noise (the instrument of Section 4.4)</text>
