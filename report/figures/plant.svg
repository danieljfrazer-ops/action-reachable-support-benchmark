<path d="M150,170 Q300,185 420,96" fill="none" stroke="#a00" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arr)"/><text x="330" y="200" text-anchor="middle" font-size="11" fill="#a00">G_b: body-confounded plant of Section 4.4 only, never built</text>
<rect x="30" y="292" width="700" height="46" rx="6" fill="#eef3f8" stroke="#222" stroke-width="1.2"/>
<text x="380" y="311" text-anchor="middle" font-size="12" font-weight="600">o = [b, d, w, x, four padding channels] + ε<tspan baseline-shift="super" font-size="8">o</tspan>    (observation layer; all channels noisy; the estimators see o and a only)</text>
<text x="380" y="328" text-anchor="middle" font-size="10.5" fill="#333">pre-event support = the b and d channels (b only at delay 2); confounded channels = half of x; the two sets are disjoint</text>
